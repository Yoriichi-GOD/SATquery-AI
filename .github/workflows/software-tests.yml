name: Software regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: software-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install software-test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check publication hygiene and benchmark consistency
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_publication.py 2>&1 | tee publication-check.log
      - name: Run software regression
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee software-tests.log
      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-checks-${{ github.sha }}
          path: |
            software-tests.log
            publication-check.log
          retention-days: 30
